
<!-- appended small script to expand mobile top nav behavior to tablets -->
<script>
(function(){
  const nav = document.getElementById('mobile-top-nav');
  function showIfNeeded(){
    if(!nav) return;
    if(window.innerWidth <= 1000){
      nav.style.display = 'flex';
      nav.setAttribute('aria-hidden','false');
      const main = document.querySelector('main');
      if(main) main.style.paddingTop = '72px';
    } else {
      nav.style.display = 'none';
      nav.setAttribute('aria-hidden','true');
      const main = document.querySelector('main');
      if(main) main.style.paddingTop = '';
    }
  }
  window.addEventListener('resize', showIfNeeded);
  document.addEventListener('DOMContentLoaded', showIfNeeded);
})();
</script>
